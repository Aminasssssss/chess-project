<nav class="navbar">
  <div class="nav-brand">
    <a routerLink="/">
      <span class="logo-piece">♟</span>
      <span class="brand-name">Chess Arena <span class="brand-kz">KZ</span></span>
    </a>
  </div>

  <div class="nav-links">
    <a routerLink="/play"        routerLinkActive="active">Играть</a>
    <a routerLink="/leaderboard" routerLinkActive="active">Рейтинг</a>
    <a routerLink="/puzzle"      routerLinkActive="active">Puzzle</a>
    <a routerLink="/pricing"     routerLinkActive="active">Pro</a>
    <a routerLink="/coach"       routerLinkActive="active">AI Тренер</a>
    <a routerLink="/learn" routerLinkActive="active">Обучение</a>
    <a routerLink="/shop"  routerLinkActive="active">Магазин</a>

    @if (auth.isLoggedIn()) {
      <a routerLink="/shop" class="nav-coins" routerLinkActive="active">
        <span class="coin-icon">◈</span>
        <span>{{ getUserCoins() }}</span>
      </a>
      <a routerLink="/profile" class="nav-avatar" routerLinkActive="active">
        <span class="avatar-letter">{{ getUserInitial() }}</span>
      </a>
      <button class="btn-logout" (click)="auth.logout()">Выйти</button>
    } @else {
      <a routerLink="/login" class="nav-login">Войти</a>
      <a routerLink="/register" class="btn-register">Начать</a>
    }


  </div>
</nav>

<main class="page-enter">
  <router-outlet />
</main>
